<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Info</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #111;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

#top {
  height: 18vh;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  padding: 12px;
}

.card {
  background: #1d1d1d;
  border-radius: 14px;
  padding: 15px;
  overflow: hidden;
}

#clock {
  font-size: 6vw;
  font-weight: bold;
  line-height: 1;
}

#date {
  font-size: 1.7vw;
  margin-top: 8px;
  color: #bbb;
}

#weatherTemp {
  font-size: 4vw;
  font-weight: bold;
}

#weatherText {
  font-size: 1.5vw;
  color: #ccc;
}

.small {
  color: #aaa;
  font-size: 1vw;
}

#main {
  flex: 1;
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
  padding: 0 12px 12px;
  min-height: 0;
}

.panel {
  background: #1d1d1d;
  border-radius: 14px;
  padding: 15px;
  overflow: hidden;
}

.panel h2 {
  margin: 0 0 10px;
  font-size: 1.7vw;
}

#calendarPanel {
  grid-row: 1 / 3;
}

.list {
  overflow: hidden;
}

.item {
  padding: 9px 0;
  border-bottom: 1px solid #333;
  font-size: 1.05vw;
}

.item:last-child {
  border-bottom: none;
}

.time {
  color: #aaa;
  font-size: .85vw;
}

.flight {
  display: grid;
  grid-template-columns: 1.1fr 1fr .8fr .7fr;
  gap: 5px;
  padding: 8px 0;
  border-bottom: 1px solid #333;
  font-size: .95vw;
}

.flight strong {
  color: #fff;
}

.news {
  padding: 9px 0;
  border-bottom: 1px solid #333;
  font-size: 1vw;
}

.news a {
  color: #fff;
  text-decoration: none;
}

.news a:hover {
  text-decoration: underline;
}

#bins {
  font-size: 1.5vw;
}

#binDate {
  font-size: 2.2vw;
  font-weight: bold;
  margin-top: 8px;
}

#binType {
  font-size: 2vw;
  margin-top: 5px;
}

#traffic {
  font-size: 1.1vw;
  color: #ccc;
}

.loading {
  color: #888;
}

.error {
  color: #e57373;
}

@media (max-width: 900px) {
  #clock {
    font-size: 10vw;
  }

  #date,
  #weatherText,
  .item,
  .flight,
  .news,
  #traffic {
    font-size: 2.5vw;
  }

  #main {
    grid-template-columns: 1fr 1fr;
  }

  #calendarPanel {
    grid-row: auto;
  }

  .panel h2 {
    font-size: 3vw;
  }
}
</style>
</head>

<body>

<div id="top">

  <div class="card">
    <div id="clock">--:--</div>
    <div id="date">Loading...</div>
  </div>

  <div class="card">
    <div id="weatherTemp">--°</div>
    <div id="weatherText">Loading weather...</div>
    <div id="weatherNext" class="small"></div>
  </div>

  <div class="card">
    <div id="bins">
      🗑️ Next bin collection
      <div id="binDate">Loading...</div>
      <div id="binType"></div>
    </div>
  </div>

</div>


<div id="main">

  <!-- CALENDAR -->

  <div class="panel" id="calendarPanel">
    <h2>📅 Calendar</h2>
    <div id="calendar" class="list">
      <div class="loading">Loading calendars...</div>
    </div>
  </div>


  <!-- AIRCRAFT -->

  <div class="panel">
    <h2>✈️ Aircraft nearby</h2>

    <div id="aircraft">
      <div class="loading">Loading aircraft...</div>
    </div>
  </div>


  <!-- NEWS -->

  <div class="panel">
    <h2>📰 Local news</h2>

    <div id="news">
      <div class="loading">Loading news...</div>
    </div>
  </div>


  <!-- WEATHER -->

  <div class="panel">
    <h2>🌤️ Next few hours</h2>

    <div id="hourlyWeather">
      <div class="loading">Loading...</div>
    </div>
  </div>


  <!-- TRAFFIC -->

  <div class="panel">
    <h2>🚗 Local traffic</h2>

    <div id="traffic">
      Checking traffic information...
    </div>
  </div>

</div>


<script>

const API =
  "https://home-info-api.chris5moore.workers.dev";


/* =========================
   CLOCK
   ========================= */

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-GB", {
      hour: "2-digit",
      minute: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-GB", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
}

updateClock();
setInterval(updateClock, 1000);


/* =========================
   WEATHER
   ========================= */

async function loadWeather() {

  try {

    const response =
      await fetch(API + "/weather");

    const data =
      await response.json();

    const current =
      data.current;

    document.getElementById("weatherTemp").textContent =
      Math.round(current.temperature_2m) + "°C";

    document.getElementById("weatherText").textContent =
      "Feels like " +
      Math.round(current.apparent_temperature) +
      "°C • Wind " +
      Math.round(current.wind_speed_10m) +
      " km/h";

    const times =
      data.hourly.time || [];

    const temps =
      data.hourly.temperature || [];

    const rain =
      data.hourly.rainChance || [];

    let html = "";

    for (
      let i = 0;
      i < Math.min(5, times.length);
      i++
    ) {

      const time =
        new Date(times[i])
          .toLocaleTimeString(
            "en-GB",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      html += `
        <div class="item">
          <strong>${time}</strong>
          &nbsp; ${Math.round(temps[i])}°C
          &nbsp; ${rain[i] ?? 0}% rain
        </div>
      `;
    }

    document.getElementById("hourlyWeather")
      .innerHTML = html;

    document.getElementById("weatherNext")
      .textContent = "Next few hours";

  } catch {

    document.getElementById("weatherText")
      .textContent =
      "Weather unavailable";

    document.getElementById("hourlyWeather")
      .innerHTML =
      '<div class="error">Weather unavailable</div>';
  }
}

loadWeather();

setInterval(loadWeather, 10 * 60 * 1000);


/* =========================
   AIRCRAFT
   ========================= */

async function loadAircraft() {

  try {

    const response =
      await fetch(API + "/planes");

    const data =
      await response.json();

    if (
      !data.aircraft ||
      !data.aircraft.length
    ) {

      document.getElementById("aircraft")
        .innerHTML =
        '<div class="loading">No aircraft detected.</div>';

      return;
    }

    let html = "";

    for (
      const plane of data.aircraft.slice(0, 12)
    ) {

      const altitude =
        typeof plane.altitude === "number"
          ? plane.altitude.toLocaleString() + " ft"
          : plane.altitude;

      const distance =
        plane.distance != null
          ? plane.distance + " nm"
          : "";

      html += `
        <div class="flight">

          <strong>
            ${plane.flight || plane.registration || "Unknown"}
          </strong>

          <span>
            ${plane.aircraft || plane.type}
          </span>

          <span>
            ${altitude}
          </span>

          <span>
            ${distance}
          </span>

        </div>
      `;
    }

    document.getElementById("aircraft")
      .innerHTML = html;

  } catch {

    document.getElementById("aircraft")
      .innerHTML =
      '<div class="error">Aircraft unavailable</div>';
  }
}

loadAircraft();

setInterval(loadAircraft, 30 * 1000);


/* =========================
   CALENDAR
   ========================= */

async function loadCalendar() {

  try {

    const response =
      await fetch(API + "/calendar");

    const data =
      await response.json();

    if (
      !data.events ||
      !data.events.length
    ) {

      document.getElementById("calendar")
        .innerHTML =
        '<div class="loading">No upcoming events.</div>';

      return;
    }

    let html = "";

    for (
      const event of data.events.slice(0, 20)
    ) {

      let start = event.start || "";

      if (
        /^\d{8}T\d{6}/.test(start)
      ) {

        const year =
          start.substring(0, 4);

        const month =
          start.substring(4, 6);

        const day =
          start.substring(6, 8);

        const hour =
          start.substring(9, 11);

        const minute =
          start.substring(11, 13);

        start =
          `${day}/${month}/${year} ${hour}:${minute}`;
      }

      html += `
        <div class="item">
          <strong>${event.summary}</strong>
          <div class="time">${start}</div>
        </div>
      `;
    }

    document.getElementById("calendar")
      .innerHTML = html;

  } catch {

    document.getElementById("calendar")
      .innerHTML =
      '<div class="error">Calendar unavailable</div>';
  }
}

loadCalendar();

setInterval(loadCalendar, 5 * 60 * 1000);


/* =========================
   NEWS
   ========================= */

async function loadNews() {

  try {

    const response =
      await fetch(API + "/news");

    const data =
      await response.json();

    if (
      !data.items ||
      !data.items.length
    ) {

      document.getElementById("news")
        .innerHTML =
        '<div class="loading">No news available.</div>';

      return;
    }

    let html = "";

    for (
      const item of data.items.slice(0, 7)
    ) {

      html += `
        <div class="news">
          <a
            href="${item.link}"
            target="_blank"
          >
            ${item.title}
          </a>
        </div>
      `;
    }

    document.getElementById("news")
      .innerHTML = html;

  } catch {

    document.getElementById("news")
      .innerHTML =
      '<div class="error">News unavailable</div>';
  }
}

loadNews();

setInterval(loadNews, 10 * 60 * 1000);


/* =========================
   BINS
   ========================= */

async function loadBins() {

  try {

    const response =
      await fetch(API + "/bins");

    const data =
      await response.json();

    if (!data.next) {

      document.getElementById("binDate")
        .textContent = "No collection found";

      return;
    }

    const date =
      new Date(data.next.date + "T12:00:00");

    document.getElementById("binDate")
      .textContent =
      date.toLocaleDateString(
        "en-GB",
        {
          weekday: "long",
          day: "numeric",
          month: "long"
        }
      );

    document.getElementById("binType")
      .textContent =
      data.next.icon +
      " " +
      data.next.bin +
      " bin";

  } catch {

    document.getElementById("binDate")
      .textContent =
      "Unavailable";
  }
}

loadBins();


/* =========================
   TRAFFIC
   ========================= */

function showTraffic() {

  document.getElementById("traffic")
    .innerHTML = `
      <div class="item">
        <strong>Blackpool / Fylde</strong>
      </div>

      <div class="item">
        Live traffic feed will be added here.
      </div>

      <div class="small">
        Traffic data requires a suitable live
        traffic provider.
      </div>
    `;
}

showTraffic();

</script>

</body>
</html>
