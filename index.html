<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chris's Home Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #101820;
    color: white;
}

.dashboard {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: 35% 65%;
    grid-template-rows: 32% 68%;
    gap: 10px;
    padding: 10px;
}

.card {
    background: #1b2730;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.35);
}

.clock-card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.time {
    font-size: clamp(55px, 8vw, 120px);
    font-weight: bold;
    line-height: 1;
}

.date {
    font-size: clamp(20px, 2.5vw, 34px);
    margin-top: 12px;
    color: #cfd8dc;
}

.weather-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.weather-left h2 {
    margin: 0 0 10px 0;
    font-size: 34px;
}

.temperature {
    font-size: 70px;
    font-weight: bold;
}

.weather-icon {
    font-size: 90px;
}

.calendar-card {
    grid-column: 1;
    grid-row: 2;
}

.calendar-card h2,
.notes-card h2 {
    margin-top: 0;
    font-size: 30px;
}

.calendar-item {
    padding: 14px;
    margin: 10px 0;
    background: #263640;
    border-radius: 12px;
}

.calendar-time {
    font-size: 18px;
    color: #90caf9;
}

.calendar-title {
    font-size: 22px;
    margin-top: 4px;
}

.notes-card {
    grid-column: 2;
    grid-row: 2;
}

textarea {
    width: 100%;
    height: calc(100% - 60px);
    resize: none;
    border: none;
    outline: none;
    border-radius: 12px;
    padding: 20px;
    font-size: 24px;
    font-family: Arial, Helvetica, sans-serif;
    background: #263640;
    color: white;
}

.footer {
    position: fixed;
    bottom: 5px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #78909c;
}

@media (orientation: portrait) {
    .dashboard {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        overflow-y: auto;
        height: auto;
        min-height: 100vh;
    }

    .calendar-card,
    .notes-card {
        grid-column: 1;
        grid-row: auto;
    }

    body {
        overflow-y: auto;
    }
}
</style>
</head>

<body>

<div class="dashboard">

    <!-- CLOCK -->
    <div class="card clock-card">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">Loading...</div>
    </div>

    <!-- WEATHER -->
    <div class="card weather-card">
        <div class="weather-left">
            <h2>Blackpool</h2>
            <div class="temperature" id="temperature">--°</div>
            <div id="weatherText">Weather loading...</div>
        </div>

        <div class="weather-icon" id="weatherIcon">🌤️</div>
    </div>

    <!-- CALENDAR -->
    <div class="card calendar-card">
        <h2>📅 Today's Calendar</h2>

        <div class="calendar-item">
            <div class="calendar-time">09:00</div>
            <div class="calendar-title">No events loaded</div>
        </div>

        <div class="calendar-item">
            <div class="calendar-time">12:00</div>
            <div class="calendar-title">Google Calendar will go here</div>
        </div>

        <div class="calendar-item">
            <div class="calendar-time">18:00</div>
            <div class="calendar-title">Your appointments and events</div>
        </div>
    </div>

    <!-- NOTES -->
    <div class="card notes-card">
        <h2>📝 Notes</h2>

        <textarea id="notes"
        placeholder="Type your notes here..."></textarea>
    </div>

</div>

<div class="footer">
    Home Dashboard
</div>

<script>

/* =========================
   CLOCK & DATE
   ========================= */

function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });

    const date = now.toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
    });

    document.getElementById("time").textContent = time;
    document.getElementById("date").textContent = date;
}

updateClock();
setInterval(updateClock, 1000);


/* =========================
   NOTES
   ========================= */

const notes = document.getElementById("notes");

notes.value = localStorage.getItem("dashboardNotes") || "";

notes.addEventListener("input", function() {
    localStorage.setItem("dashboardNotes", notes.value);
});


/* =========================
   WEATHER
   ========================= */

async function getWeather() {

    try {

        /*
        Blackpool approximate coordinates.
        Weather is obtained from Open-Meteo.
        No account or API key required.
        */

        const latitude = 53.8175;
        const longitude = -3.0357;

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" + latitude +
            "&longitude=" + longitude +
            "&current=temperature_2m,weather_code" +
            "&timezone=Europe%2FLondon";

        const response = await fetch(url);
        const data = await response.json();

        const temperature =
            Math.round(data.current.temperature_2m);

        const code =
            data.current.weather_code;

        document.getElementById("temperature")
            .textContent = temperature + "°C";

        let text = "Weather";
        let icon = "🌤️";

        if (code === 0) {
            text = "Clear sky";
            icon = "☀️";
        }
        else if (code <= 3) {
            text = "Partly cloudy";
            icon = "🌤️";
        }
        else if (code <= 48) {
            text = "Fog";
            icon = "🌫️";
        }
        else if (code <= 67) {
            text = "Rain";
            icon = "🌧️";
        }
        else if (code <= 77) {
            text = "Snow";
            icon = "❄️";
        }
        else if (code <= 82) {
            text = "Rain showers";
            icon = "🌦️";
        }
        else {
            text = "Stormy";
            icon = "⛈️";
        }

        document.getElementById("weatherText")
            .textContent = text;

        document.getElementById("weatherIcon")
            .textContent = icon;

    } catch (error) {

        document.getElementById("weatherText")
            .textContent = "Weather unavailable";

    }
}

getWeather();

setInterval(getWeather, 15 * 60 * 1000);

</script>

</body>
</html>
